<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Battlefield board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Marcellus&amp;family=Exo+2:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0c0f15}
</style>
</helmet>
<div role="img" aria-label="{{label}}" style="position:absolute;inset:0;overflow:hidden;container-type:size;background:#0c0f15;font-family:'Exo 2',system-ui,sans-serif;color:#eff4ff">
  <img src="{{ground}}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.5) saturate(.85)">
  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100cqw,66.667cqh);height:min(150cqw,100cqh);background-color:rgba(10,12,17,.3);background-image:linear-gradient(to right,rgba(239,244,255,.09) 1px,transparent 1px),linear-gradient(to bottom,rgba(239,244,255,.09) 1px,transparent 1px);background-size:5% 3.3333%;box-shadow:0 0 0 1px #262c38">

    <svg viewBox="0 0 200 300" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%">
      <polyline opacity="{{bandOp}}" points="{{route}}" fill="none" stroke="#ffb15f" stroke-opacity="0.2" stroke-width="20" stroke-linejoin="round"></polyline>
      <polyline opacity="{{routeOp}}" points="{{route}}" fill="none" stroke="#86ccff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 3.4"></polyline>
    </svg>

    <sc-for list="{{towers}}" as="t" hint-placeholder-count="21">
      <div style="position:absolute;left:{{t.l}}%;top:{{t.t}}%;width:10%;height:6.6667%;border-radius:2px;background:rgba(7,9,13,.5);box-shadow:inset 0 0 0 1px rgba(38,44,56,.9)">
        <img src="{{t.src}}" alt="" style="position:absolute;left:-10%;top:-30%;width:120%;height:130%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.85))">
      </div>
    </sc-for>

    <sc-if value="{{selected}}" hint-placeholder-val="{{false}}">
      <div style="position:absolute;left:37.5%;top:41.67%;width:35%;height:23.33%;border-radius:50%;box-sizing:border-box;border:1.5px dashed #f0d188;background:rgba(240,209,136,.08)"></div>
      <div style="position:absolute;left:50%;top:50%;width:10%;height:6.6667%;box-sizing:border-box;border:2px solid #f0d188;border-radius:3px;box-shadow:0 0 10px rgba(240,209,136,.6)"></div>
    </sc-if>

    <sc-for list="{{creeps}}" as="c" hint-placeholder-count="0">
      <div style="position:absolute;left:{{c.l}}%;top:{{c.t}}%;width:{{c.w}}%;aspect-ratio:1">
        <div style="position:absolute;left:5%;right:5%;top:-28%;height:12%;min-height:2px;background:#07090d"><div style="height:100%;width:{{c.hp}}%;background:{{c.hpc}}"></div></div>
        <img src="{{c.src}}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;box-shadow:0 0 0 1.5px {{c.ring}},0 2px 4px rgba(0,0,0,.8)">
      </div>
    </sc-for>

    <sc-if value="{{fxBuild}}" hint-placeholder-val="{{false}}">
      <div style="position:absolute;left:70%;top:23.33%;width:10%;height:6.6667%;box-sizing:border-box;border:1.5px dashed #ff7b6b;border-radius:2px;background:rgba(255,123,107,.14)"></div>
      <div style="position:absolute;right:2%;top:31.5%;padding:2px 6px;border-radius:3px;background:rgba(7,9,13,.88);box-shadow:inset 0 0 0 1px #7a1d14;font-size:11px;font-weight:600;color:#ff7b6b;white-space:nowrap">Blocks the path</div>
      <div style="position:absolute;left:48%;top:46%;font-family:Cinzel,serif;font-weight:900;font-size:12px;color:#f0d188;text-shadow:0 1px 0 #000,0 0 3px #000,0 0 3px #000">−$90</div>
    </sc-if>
    <sc-if value="{{fxWave}}" hint-placeholder-val="{{false}}">
      <div style="position:absolute;left:58%;top:33%;font-family:Cinzel,serif;font-weight:900;font-size:12px;color:#f0d188;text-shadow:0 1px 0 #000,0 0 3px #000,0 0 3px #000">+12</div>
      <div style="position:absolute;left:20%;top:44%;font-family:Cinzel,serif;font-weight:900;font-size:12px;color:#f0d188;text-shadow:0 1px 0 #000,0 0 3px #000,0 0 3px #000">+8</div>
      <div style="position:absolute;left:58%;bottom:4%;display:flex;align-items:center;gap:3px;padding:1px 6px 1px 3px;border-radius:3px;background:rgba(7,9,13,.88);box-shadow:inset 0 0 0 1px #7a1d14;font-family:Cinzel,serif;font-weight:900;font-size:12px;color:#ff7b6b">
        <img src="/_blob/7776b25f5507e56d8842ede6ee910b14" alt="" style="width:16px;height:16px">−1
      </div>
    </sc-if>

    <div style="position:absolute;left:50%;top:0;transform:translate(-50%,0);padding:1px 10px;border-radius:0 0 3px 3px;background:#07090d;box-shadow:inset 0 0 0 1px #44aa44;font-family:Cinzel,serif;font-weight:900;font-size:10px;letter-spacing:.12em;color:#eff4ff">IN</div>
    <div style="position:absolute;left:50%;bottom:0;transform:translate(-50%,0);padding:1px 10px;border-radius:3px 3px 0 0;background:#07090d;box-shadow:inset 0 0 0 1px #ff7b6b;font-family:Cinzel,serif;font-weight:900;font-size:10px;letter-spacing:.12em;color:#eff4ff">OUT</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phase":{"editor":"enum","options":["build","wave"],"default":"build"},"view":{"editor":"enum","options":["mine","enemy"],"default":"mine"},"selected":{"editor":"boolean","default":false},"$preview":{"width":300,"height":450}}'>
class Component extends DCLogic {
  renderVals() {
    const wave = (this.props.phase ?? 'build') === 'wave';
    const enemy = (this.props.view ?? 'mine') === 'enemy';
    const sel = !!this.props.selected && !enemy;
    const U = { A: '/_blob/5607b86a204f411341c453e95356c8c9', O: '/_blob/790d1760c4d1a0e006928cff180aec00', F: '/_blob/609020dac486f8b480ec758fdfd97947', P: '/_blob/c8279da216f048377a362e7e138589b5' };
    const R = { S: '/_blob/d0150f9aade9295004ae2c77cf3ad8ac', B: '/_blob/c80febb27457b7d00556442c038a400c', L: '/_blob/ba0029b600f8afe76eed3424a7e156ad', T: '/_blob/63c80eecf608ade96f9c5d1d9018a5ae' };
    const walls = enemy
      ? [[6, 6, 'SSBSLSS'], [14, 0, 'SLSTSSB'], [22, 6, 'SBSSLST']]
      : [[7, 0, 'AAPAFAA'], [15, 6, 'AFAPAAO'], [23, 0, 'AAOAPAA']];
    const towers = [];
    walls.forEach(([row, col0, types]) => types.split('').forEach((k, i) => {
      towers.push({ l: (col0 + i * 2) / 20 * 100, t: row / 30 * 100, src: (enemy ? R : U)[k] });
    }));
    const route = enemy
      ? '100,0 100,30 30,30 30,110 170,110 170,190 30,190 30,270 100,270 100,300'
      : '100,0 100,45 170,45 170,120 30,120 30,200 170,200 170,275 100,275 100,300';
    const OP = ['/_blob/81ed14bb17fe4c0eb589ca9a763ebedf', '/_blob/976b364b008d88dd3b1fddccca2188a1', '/_blob/c0ab06e553e934ca187358648af207d4', '/_blob/7b9829439191eb3885382d515935e387'];
    const UP = ['/_blob/2ca858c63065af75f6e188e84a545fe7', '/_blob/a45d89ade6665c8072c1ab442844fa89', '/_blob/78d4543a9b0691f1ac2bb6232e68e58f', '/_blob/8aaabe31c5f075cc9a5dbf346a5026d0'];
    const P = enemy ? UP : OP;
    const ring = enemy ? '#8fd14f' : '#ec7048';
    const pts = enemy
      ? [[100, 14, 0, 100], [60, 30, 1, 70], [30, 70, 0, 90], [80, 110, 2, 40], [140, 110, 3, 85]]
      : [[100, 18, 0, 100], [128, 45, 0, 80], [157, 45, 1, 45], [170, 90, 0, 90], [146, 120, 1, 20], [62, 120, 3, 75], [30, 165, 2, 100]];
    const creeps = wave ? pts.map(([x, y, k, hp]) => {
      const big = k === 3;
      const w = big ? 10 : 7;
      return { l: x / 2 - w / 2, t: y / 3 - (w * 2 / 3) / 2, w, src: P[k], hp, ring: big ? '#ffb15f' : ring,
        hpc: hp > 60 ? '#44aa44' : (hp > 30 ? '#ffb15f' : '#ff7b6b') };
    }) : [];
    return {
      ground: enemy ? '/_blob/c955829f5e76fb4a99eac474f8ad2254' : '/_blob/3731a947e9479da07c6cf4972cc1a423',
      towers, route, creeps, selected: sel,
      bandOp: wave || enemy ? 0 : 1,
      routeOp: wave ? 0.3 : (enemy ? 0.45 : 1),
      fxBuild: !wave && !enemy && !sel,
      fxWave: wave && !enemy,
      label: (enemy ? 'Enemy board, read-only' : 'Your board') + (wave ? ', wave in progress' : ', build phase') + ': maze of 2×2 towers from IN at top to OUT at bottom'
    };
  }
}
</script>
</body>
</html>
