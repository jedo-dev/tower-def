      { id: 'b', name: 'Cursed Arrows', icon: '/_blob/41dc3c87c5b9cddf8870e166cc5fad55', desc: 'Hits curse the target: it takes more damage.',
        rows: [{ k: 'Bonus', v: ['+10%', '+15%', '+20%', '+30%'] }, { k: 'Curse', v: ['2s', '2.5s', '3s', '3s'] }] }
    ];
    const chosen = B.find((b) => b.id === picked);
    return {
      dot2: picked ? '/_blob/81ee62df4e6d108dd3140edf6c561adb' : '/_blob/803112d949d38ca40c70f0dcca4c9280',
      stepText: picked ? 'Step 2 of 2 · Confirm' : 'Step 1 of 2 · Choose a branch',
      branches: B.map((b) => {
        const on = b.id === picked;
        return { ...b, on,
          bg: on ? '#1a1f2c' : '#12151d',
          ring: on ? 'inset 0 0 0 2px #f0d188,0 0 12px rgba(240,209,136,.35)' : 'inset 0 0 0 1px #262c38',
          op: picked && !on ? 0.7 : 1,
          pick: () => this.setState({ picked: b.id }) };
      }),
      noPick: !picked,
      backText: picked ? 'BACK' : 'CANCEL',
      confirmText: chosen ? 'CONFIRM ' + chosen.name.toUpperCase() + ' · $120' : 'CHOOSE A BRANCH FIRST',
      cFg: chosen ? '#eff4ff' : '#9fb2d4',
      cFilter: chosen ? 'none' : 'grayscale(1) brightness(.45)',
      reset: () => this.setState({ picked: null })
    };
  }
}
</script>
